<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Shop - Cute Admin & Store</title>
<!-- FontAwesome untuk Ikon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#fff0f6;
    padding-bottom: 20px;
}

header{
    background:#ff69b4;
    color:white;
    text-align:center;
    padding:20px 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 10px rgba(255,105,180,0.3);
}

header h1{
    font-size:26px;
}

/* Navigasi Header Right */
.header-actions {
    position: absolute;
    right: 15px;
    top: 18px;
    display: flex;
    gap: 8px;
}

.nav-btn {
    background: white;
    color: #ff1493;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    transition: transform 0.2s;
}

.nav-btn:active {
    transform: scale(0.95);
}

.cart-count-badge {
    background: #ff1493;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 11px;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:12px;
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    border-radius:15px;
    box-shadow:0 5px 12px rgba(255,105,180,.25);
    overflow:hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    background-color: #ffe4e1;
}

.card-content{
    padding:12px 10px;
    text-align:center;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: space-between;
}

.card h2{
    color:#ff1493;
    font-size: 15px;
    margin-bottom: 4px;
}

.card-content p:not(.harga) {
    font-size: 12px;
    color: #555;
    margin-bottom: 10px;
    line-height: 1.3;
}

.harga{
    color:#e91e63;
    font-size:15px;
    font-weight:bold;
    margin:6px 0;
}

button{
    width:100%;
    padding:8px 10px;
    border:none;
    background:#ff69b4;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight: bold;
    font-size: 13px;
    transition: background 0.2s;
}

button:hover{
    background:#ff1493;
}

.btn-delete-prod {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(255, 77, 77, 0.9);
    color: white;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* --- MODAL GLOBAL --- */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 440px;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(255,105,180,0.3);
    position: relative;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #ffd1dc;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.modal-header h3 {
    color: #ff1493;
    font-size: 18px;
}

.close-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: #888;
    cursor: pointer;
    width: auto;
}

/* Form Styles */
.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #ff1493;
    margin-bottom: 4px;
}

.form-input {
    width: 100%;
    padding: 8px 12px;
    border: 1.5px solid #ffd1dc;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    background: #fff8fa;
}

.form-input:focus {
    border-color: #ff1493;
    background: #fff;
}

/* Modal Keranjang */
.cart-list {
    overflow-y: auto;
    flex-grow: 1;
    max-height: 250px;
    margin-bottom: 15px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #ffe4e1;
}

.cart-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
}

.cart-item-info {
    flex-grow: 1;
}

.cart-item-title {
    font-size: 13px;
    font-weight: bold;
    color: #333;
}

.cart-item-price {
    font-size: 12px;
    color: #e91e63;
    font-weight: bold;
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
}

.qty-btn {
    background: #ff69b4;
    color: white;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.qty-number {
    font-size: 12px;
    font-weight: bold;
}

.delete-item-btn {
    background: none;
    border: none;
    color: #ff4d4d;
    cursor: pointer;
    font-size: 14px;
    width: auto;
}

/* Modal Pembayaran */
.payment-methods {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}

.payment-option {
    border: 1px solid #ffd1dc;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
}

.payment-option input {
    accent-color: #ff1493;
}

.payment-details {
    background: #fafafa;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 15px;
    font-size: 12px;
    color: #444;
}

.bank-select {
    width: 100%;
    padding: 6px;
    border: 1px solid #ff69b4;
    border-radius: 6px;
    margin-top: 6px;
}

.qris-box {
    text-align: center;
}

.qris-box img {
    width: 120px;
    height: 120px;
    margin: 8px 0;
}

.total-price-box {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: bold;
    color: #ff1493;
    margin-bottom: 12px;
}

/* Admin Tabs */
.admin-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.admin-tab-btn {
    flex: 1;
    padding: 6px;
    font-size: 12px;
    background: #ffe4e1;
    color: #ff1493;
    border-radius: 8px;
}

.admin-tab-btn.active {
    background: #ff1493;
    color: white;
}

.order-history-list {
    overflow-y: auto;
    max-height: 250px;
    font-size: 12px;
}

.order-card {
    background: #fff0f6;
    border: 1px solid #ffd1dc;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
}

footer{
    background:#ff69b4;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

/* Toast Notifikasi */
#toast {
    visibility: hidden;
    min-width: 200px;
    background-color: #ff1493;
    color: #fff;
    text-align: center;
    border-radius: 20px;
    padding: 10px 15px;
    position: fixed;
    z-index: 1001;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    font-size: 13px;
    font-weight: bold;
}

#toast.show {
    visibility: visible;
    animation: fadein 0.3s, fadeout 0.3s 2s;
}

@keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 25px; opacity: 1;} }
@keyframes fadeout { from {bottom: 25px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>

</head>
<body>

<header>
    <h1>🌸 Pink Shop 🌸</h1>
    <p>Belanja Fashion & Beauty</p>
    
    <div class="header-actions">
        <!-- Tombol Login / Admin -->
        <button class="nav-btn" id="login-nav-btn" onclick="openLogin()">
            <i class="fas fa-user"></i>
            <span id="login-btn-text">Login</span>
        </button>

        <!-- Tombol Keranjang -->
        <button class="nav-btn" onclick="openCart()">
            <i class="fas fa-shopping-cart"></i>
            <span>Keranjang</span>
            <span class="cart-count-badge" id="cart-badge">0</span>
        </button>
    </div>
</header>

<!-- KATALOG PRODUK DINAMIS -->
<div class="container" id="product-container">
    <!-- Di-render lewat JavaScript -->
</div>

<!-- MODAL 1: LOGIN -->
<div class="modal-overlay" id="login-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔐 Login Admin / User</h3>
            <button class="close-btn" onclick="closeLogin()">&times;</button>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-input" placeholder="Masukkan username..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="Masukkan password..." required>
            </div>
            <p style="font-size:11px; color:#888; margin-bottom:12px;">
                💡 <strong>Hint Admin:</strong> Username: <code>admin</code> | Password: <code>admin123</code>
            </p>
            <button type="submit">Masuk Sekarang 🎀</button>
        </form>
    </div>
</div>

<!-- MODAL 2: ADMIN DASHBOARD -->
<div class="modal-overlay" id="admin-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>👑 Panel Admin Cute</h3>
            <button class="close-btn" onclick="closeAdmin()">&times;</button>
        </div>
        
        <div class="admin-tabs">
            <button class="admin-tab-btn active" id="tab-add-btn" onclick="switchAdminTab('add')">➕ Tambah Produk</button>
            <button class="admin-tab-btn" id="tab-orders-btn" onclick="switchAdminTab('orders')">📦 Pesanan (<span id="order-count">0</span>)</button>
        </div>

        <!-- TAB 1: TAMBAH PRODUK -->
        <div id="admin-tab-add">
            <form onsubmit="handleAddProduct(event)">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="prod-name" class="form-input" placeholder="Cth: Cermin Cute Pink" required>
                </div>
                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" id="prod-price" class="form-input" placeholder="Cth: 25000" required>
                </div>
                <div class="form-group">
                    <label>Link Foto Produk (URL Image)</label>
                    <input type="text" id="prod-img" class="form-input" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Deskripsi Singkat</label>
                    <input type="text" id="prod-desc" class="form-input" placeholder="Cth: Cermin genggam imut." required>
                </div>
                <button type="submit" style="background:#ff1493;">Simpan Produk Baru 🌸</button>
            </form>
        </div>

        <!-- TAB 2: RIWAYAT PESANAN -->
        <div id="admin-tab-orders" style="display:none;">
            <p style="font-size:12px; margin-bottom:8px; font-weight:bold; color:#ff1493;">
                Total Pendapatan: <span id="total-revenue">Rp0</span>
            </p>
            <div class="order-history-list" id="order-history-container">
                <!-- Diisi via JS -->
            </div>
        </div>
        
        <button onclick="handleLogout()" style="margin-top:15px; background:#888;">Logout 🚪</button>
    </div>
</div>

<!-- MODAL 3: KERANJANG BELANJA -->
<div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🛒 Keranjang Saya</h3>
            <button class="close-btn" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-list" id="cart-items-container">
            <!-- Item keranjang dimasukkan lewat JS -->
        </div>
        <div>
            <div class="total-price-box">
                <span>Total:</span>
                <span id="cart-total-price">Rp0</span>
            </div>
            <button onclick="goToPayment()">Lanjut Ke Pembayaran</button>
        </div>
    </div>
</div>

<!-- MODAL 4: OPSI PEMBAYARAN -->
<div class="modal-overlay" id="payment-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>💳 Metode Pembayaran</h3>
            <button class="close-btn" onclick="closePayment()">&times;</button>
        </div>
        
        <div class="payment-methods">
            <label class="payment-option">
                <input type="radio" name="payment" value="qris" checked onclick="selectPayment('qris')">
                <i class="fas fa-qrcode" style="color:#ff1493;"></i>
                <span><strong>QRIS</strong> (Gopay, OVO, Dana, ShopeePay)</span>
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="transfer" onclick="selectPayment('transfer')">
                <i class="fas fa-university" style="color:#ff1493;"></i>
                <span><strong>Transfer Bank</strong></span>
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="cod" onclick="selectPayment('cod')">
                <i class="fas fa-truck" style="color:#ff1493;"></i>
                <span><strong>COD</strong> (Bayar di Tempat)</span>
            </label>
        </div>

        <div class="payment-details" id="payment-details-box">
            <!-- Detail dimuat lewat JS -->
        </div>

        <div>
            <div class="total-price-box">
                <span>Total Tagihan:</span>
                <span id="pay-total-price">Rp0</span>
            </div>
            <button onclick="processCheckout()">Selesaikan Checkout</button>
        </div>
    </div>
</div>

<footer>
© 2026 Pink Shop
</footer>

<!-- ELEMEN NOTIFIKASI TOAST -->
<div id="toast"></div>

<!-- JAVASCRIPT KERANJANG + ADMIN + PAYMENT -->
<script>
// Data Produk
let products = [
    { id: 0, name: "Dress Pink", price: 199000, desc: "Dress cantik warna pink.", img: "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=500&q=80" },
    { id: 1, name: "Tas Aesthetic", price: 159000, desc: "Tas wanita kekinian.", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500&q=80" },
    { id: 2, name: "Sepatu Pink", price: 249000, desc: "Sepatu nyaman dan modis.", img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500&q=80" },
    { id: 3, name: "Parfum", price: 89000, desc: "Wangi tahan lama.", img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=500&q=80" },
    { id: 4, name: "Boneka Teddy", price: 99000, desc: "Boneka lucu dan lembut.", img: "https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=500&q=80" },
    { id: 5, name: "Case HP Pink", price: 39000, desc: "Case HP aesthetic.", img: "https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500&q=80" }
];

// State Global
let cart = [];
let orders = [];
let selectedPaymentMethod = 'qris';
let currentUser = null; // 'admin' atau 'user'

// Initial Load
document.addEventListener("DOMContentLoaded", () => {
    renderProducts();
});

// Render Katalog Produk Dinamis
function renderProducts() {
    const container = document.getElementById('product-container');
    container.innerHTML = products.map(p => `
        <div class="card">
            ${currentUser === 'admin' ? `<div class="btn-delete-prod" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></div>` : ''}
            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150/ff69b4/ffffff?text=${encodeURIComponent(p.name)}'">
            <div class="card-content">
                <h2>${p.name}</h2>
                <p class="harga">Rp${p.price.toLocaleString('id-ID')}</p>
                <p>${p.desc}</p>
                <button onclick="addToCart(${p.id})">Beli Sekarang</button>
            </div>
        </div>
    `).join('');
}

// ---------------- ALUR LOGIN & ADMIN ----------------
function openLogin() {
    if (currentUser === 'admin') {
        openAdmin();
    } else {
        document.getElementById('login-modal').style.display = 'flex';
    }
}

function closeLogin() {
    document.getElementById('login-modal').style.display = 'none';
}

function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    if (user === 'admin' && pass === 'admin123') {
        currentUser = 'admin';
        document.getElementById('login-btn-text').innerText = 'Admin Panel';
        showToast("👑 Login sebagai Admin Berhasil!");
        closeLogin();
        renderProducts();
        openAdmin();
    } else {
        currentUser = 'user';
        document.getElementById('login-btn-text').innerText = user;
        showToast(`🌸 Halo, ${user}! Selamat Belanja`);
        closeLogin();
    }
}

function handleLogout() {
    currentUser = null;
    document.getElementById('login-btn-text').innerText = 'Login';
    closeAdmin();
    renderProducts();
    showToast("👋 Berhasil Logout!");
}

function openAdmin() {
    renderOrders();
    document.getElementById('admin-modal').style.display = 'flex';
}

function closeAdmin() {
    document.getElementById('admin-modal').style.display = 'none';
}

function switchAdminTab(tab) {
    if (tab === 'add') {
        document.getElementById('admin-tab-add').style.display = 'block';
        document.getElementById('admin-tab-orders').style.display = 'none';
        document.getElementById('tab-add-btn').classList.add('active');
        document.getElementById('tab-orders-btn').classList.remove('active');
    } else {
        document.getElementById('admin-tab-add').style.display = 'none';
        document.getElementById('admin-tab-orders').style.display = 'block';
        document.getElementById('tab-add-btn').classList.remove('active');
        document.getElementById('tab-orders-btn').classList.add('active');
    }
}

// Tambah Produk Baru oleh Admin
function handleAddProduct(e) {
    e.preventDefault();
    const name = document.getElementById('prod-name').value;
    const price = parseInt(document.getElementById('prod-price').value);
    const img = document.getElementById('prod-img').value;
    const desc = document.getElementById('prod-desc').value;

    const newProd = {
        id: Date.now(),
        name,
        price,
        img,
        desc
    };

    products.push(newProd);
    renderProducts();
    showToast("✨ Produk berhasil ditambahkan!");
    
    // Reset Form
    e.target.reset();
}

// Hapus Produk dari Katalog oleh Admin
function deleteProduct(prodId) {
    if (confirm("Yakin ingin menghapus produk ini dari katalog?")) {
        products = products.filter(p => p.id !== prodId);
        renderProducts();
        showToast("🗑️ Produk berhasil dihapus!");
    }
}

// Render Pesanan Masuk di Panel Admin
function renderOrders() {
    const container = document.getElementById('order-history-container');
    document.getElementById('order-count').innerText = orders.length;

    const totalRev = orders.reduce((sum, o) => sum + o.total, 0);
    document.getElementById('total-revenue').innerText = `Rp${totalRev.toLocaleString('id-ID')}`;

    if (orders.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#888; padding:20px;">Belum ada pesanan masuk.</p>`;
    } else {
        container.innerHTML = orders.map((o, idx) => `
            <div class="order-card">
                <div style="display:flex; justify-content:space-between; font-weight:bold; color:#ff1493;">
                    <span>Order #${idx + 1}</span>
                    <span>Rp${o.total.toLocaleString('id-ID')}</span>
                </div>
                <div style="margin:4px 0; color:#555;">${o.items.map(i => `${i.name} (x${i.qty})`).join(', ')}</div>
                <div style="font-size:10px; color:#888;">💳 ${o.paymentMethod} | 🕒 ${o.date}</div>
            </div>
        `).join('');
    }
}

// ---------------- ALUR KERANJANG BELANJA ----------------
function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    const existingItem = cart.find(item => item.id === productId);

    if (existingItem) {
        existingItem.qty += 1;
    } else {
        cart.push({ ...product, qty: 1 });
    }

    updateCartUI();
    showToast(`🌸 ${product.name} masuk keranjang!`);
}

function changeQty(productId, delta) {
    const item = cart.find(i => i.id === productId);
    if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
            cart = cart.filter(i => i.id !== productId);
        }
    }
    updateCartUI();
}

function removeItem(productId) {
    cart = cart.filter(i => i.id !== productId);
    updateCartUI();
}

function updateCartUI() {
    const badge = document.getElementById('cart-badge');
    const container = document.getElementById('cart-items-container');
    const totalPriceEl = document.getElementById('cart-total-price');

    const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
    badge.innerText = totalItems;

    if (cart.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">Keranjang belanja Anda kosong 🌸</p>`;
    } else {
        container.innerHTML = cart.map(item => `
            <div class="cart-item">
                <img src="${item.img}" alt="${item.name}">
                <div class="cart-item-info">
                    <div class="cart-item-title">${item.name}</div>
                    <div class="cart-item-price">Rp${(item.price * item.qty).toLocaleString('id-ID')}</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="qty-number">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
                <button class="delete-item-btn" onclick="removeItem(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `).join('');
    }

    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    totalPriceEl.innerText = `Rp${totalPrice.toLocaleString('id-ID')}`;
    document.getElementById('pay-total-price').innerText = `Rp${totalPrice.toLocaleString('id-ID')}`;
}

function openCart() {
    document.getElementById('cart-modal').style.display = 'flex';
}
function closeCart() {
    document.getElementById('cart-modal').style.display = 'none';
}

// ---------------- ALUR PEMBAYARAN & CHECKOUT ----------------
function goToPayment() {
    if (cart.length === 0) {
        alert("Keranjang masih kosong! Silakan pilih produk terlebih dahulu.");
        return;
    }
    closeCart();
    selectPayment('qris');
    document.getElementById('payment-modal').style.display = 'flex';
}

function closePayment() {
    document.getElementById('payment-modal').style.display = 'none';
}

function selectPayment(method) {
    selectedPaymentMethod = method;
    const box = document.getElementById('payment-details-box');

    if (method === 'qris') {
        box.innerHTML = `
            <div class="qris-box">
                <p>Scan QRIS berikut untuk membayar:</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PinkShopPayment" alt="QRIS Code">
                <p>Mendukung BCA, Mandiri, GoPay, OVO, ShopeePay</p>
            </div>
        `;
    } else if (method === 'transfer') {
        box.innerHTML = `
            <p>Pilih Bank Tujuan Transfer:</p>
            <select class="bank-select" id="bank-choice">
                <option value="BCA">Bank BCA (8830123999 a.n Pink Shop)</option>
                <option value="Mandiri">Bank Mandiri (137000998811 a.n Pink Shop)</option>
                <option value="BRI">Bank BRI (0123010998877 a.n Pink Shop)</option>
                <option value="BNI">Bank BNI (0987654321 a.n Pink Shop)</option>
            </select>
        `;
    } else if (method === 'cod') {
        box.innerHTML = `
            <p><strong>Bayar di Tempat (COD)</strong></p>
            <p style="margin-top:5px; color:#666;">Siapkan uang pas saat kurir mengantarkan paket pesanan Anda.</p>
        `;
    }
}

function processCheckout() {
    let methodTitle = selectedPaymentMethod.toUpperCase();
    if (selectedPaymentMethod === 'transfer') {
        const bank = document.getElementById('bank-choice').value;
        methodTitle = `Transfer ${bank}`;
    }

    const totalVal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

    // Simpan data pesanan ke Admin
    orders.push({
        id: Date.now(),
        items: [...cart],
        total: totalVal,
        paymentMethod: methodTitle,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    alert(`✨ Pesanan Berhasil Dibuat!\n\nPembayaran via: ${methodTitle}\nTotal: Rp${totalVal.toLocaleString('id-ID')}\n\nTerima kasih telah berbelanja di Pink Shop! 🌸`);
    
    // Reset Keranjang
    cart = [];
    updateCartUI();
    closePayment();
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.className = "show";
    setTimeout(() => { toast.className = ""; }, 2200);
}
</script>

</body>
</html>
