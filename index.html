<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Shop - Skincare & Kipas Genggam</title>
<!-- FontAwesome untuk Ikon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fff0f6;
    padding-bottom: 20px;
}

header{
    background:#ff69b4;
    color:white;
    text-align:center;
    padding:20px 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 10px rgba(255,105,180,0.3);
}

header h1{
    font-size:28px;
}

/* Tombol Floating / Badge Keranjang di Header */
.cart-btn-header {
    position: absolute;
    right: 15px;
    top: 20px;
    background: white;
    color: #ff1493;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.2s;
}

.cart-btn-header:active {
    transform: scale(0.95);
}

.cart-count-badge {
    background: #ff1493;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 11px;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:12px;
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    border-radius:15px;
    box-shadow:0 5px 12px rgba(255,105,180,.3);
    overflow:hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    background-color: #ffe4e1;
}

.card-content{
    padding:12px 10px;
    text-align:center;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: space-between;
}

.card h2{
    color:#ff1493;
    font-size: 16px;
    margin-bottom: 4px;
}

.card-content p:not(.harga) {
    font-size: 12px;
    color: #555;
    margin-bottom: 10px;
    line-height: 1.3;
}

.harga{
    color:#e91e63;
    font-size:16px;
    font-weight:bold;
    margin:6px 0;
}

button{
    width:100%;
    padding:8px 10px;
    border:none;
    background:#ff69b4;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight: bold;
    font-size: 13px;
    transition: background 0.2s;
}

button:hover{
    background:#ff1493;
}

/* --- MODAL GLOBAL --- */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 420px;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #fff0f6;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.modal-header h3 {
    color: #ff1493;
}

.close-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: #888;
    cursor: pointer;
    width: auto;
}

/* Modal Keranjang List */
.cart-list {
    overflow-y: auto;
    flex-grow: 1;
    max-height: 250px;
    margin-bottom: 15px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #ffe4e1;
}

.cart-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
}

.cart-item-info {
    flex-grow: 1;
}

.cart-item-title {
    font-size: 13px;
    font-weight: bold;
    color: #333;
}

.cart-item-price {
    font-size: 12px;
    color: #e91e63;
    font-weight: bold;
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
}

.qty-btn {
    background: #ff69b4;
    color: white;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.qty-number {
    font-size: 12px;
    font-weight: bold;
}

.delete-item-btn {
    background: none;
    border: none;
    color: #ff4d4d;
    cursor: pointer;
    font-size: 14px;
    width: auto;
}

/* Modal Pembayaran Style */
.payment-methods {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}

.payment-option {
    border: 1px solid #ffd1dc;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s;
}

.payment-option:hover, .payment-option.active {
    background: #fff0f6;
    border-color: #ff1493;
}

.payment-option input {
    accent-color: #ff1493;
}

.payment-details {
    background: #fafafa;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 15px;
    font-size: 12px;
    color: #444;
}

.bank-select {
    width: 100%;
    padding: 6px;
    border: 1px solid #ff69b4;
    border-radius: 6px;
    margin-top: 6px;
}

.qris-box {
    text-align: center;
}

.qris-box img {
    width: 140px;
    height: 140px;
    margin: 8px 0;
}

.total-price-box {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: bold;
    color: #ff1493;
    margin-bottom: 12px;
}

footer{
    background:#ff69b4;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

/* Toast Notifikasi */
#toast {
    visibility: hidden;
    min-width: 200px;
    background-color: #ff1493;
    color: #fff;
    text-align: center;
    border-radius: 20px;
    padding: 10px 15px;
    position: fixed;
    z-index: 1001;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    font-size: 13px;
    font-weight: bold;
}

#toast.show {
    visibility: visible;
    animation: fadein 0.3s, fadeout 0.3s 2s;
}

@keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 25px; opacity: 1;} }
@keyframes fadeout { from {bottom: 25px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>

</head>
<body>

<header>
    <h1>🌸 Pink Shop 🌸</h1>
    <p>Belanja Skincare & Kipas Genggam</p>
    <div class="cart-btn-header" onclick="openCart()">
        <i class="fas fa-shopping-cart"></i>
        <span>Keranjang</span>
        <span class="cart-count-badge" id="cart-badge">0</span>
    </div>
</header>

<div class="container">

    <!-- Produk Skincare -->
    <div class="card">
        <img src="img/skincare.jpg" alt="Skincare">
        <div class="card-content">
            <h2>Skincare</h2>
            <p class="harga">Rp129.000</p>
            <p>Paket skincare lengkap.</p>
            <button onclick="addToCart(0)">Beli Sekarang</button>
        </div>
    </div>

    <!-- Produk Kipas Genggam -->
    <div class="card">
        <img src="img/kipas.jpg" alt="Kipas">
        <div class="card-content">
            <h2>Kipas Genggam</h2>
            <p class="harga">Rp45.000</p>
            <p>Kipas mini isi ulang.</p>
            <button onclick="addToCart(1)">Beli Sekarang</button>
        </div>
    </div>

</div>

<!-- MODAL 1: KERANJANG BELANJA -->
<div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🛒 Keranjang Belanja</h3>
            <button class="close-btn" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-list" id="cart-items-container">
            <!-- Item dimasukkan otomatis via JS -->
        </div>
        <div>
            <div class="total-price-box">
                <span>Total:</span>
                <span id="cart-total-price">Rp0</span>
            </div>
            <button onclick="goToPayment()">Lanjut Ke Pembayaran</button>
        </div>
    </div>
</div>

<!-- MODAL 2: METODE PEMBAYARAN & CHECKOUT -->
<div class="modal-overlay" id="payment-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>💳 Pilih Pembayaran</h3>
            <button class="close-btn" onclick="closePayment()">&times;</button>
        </div>
        
        <div class="payment-methods">
            <label class="payment-option">
                <input type="radio" name="payment" value="qris" checked onclick="selectPayment('qris')">
                <i class="fas fa-qrcode" style="color:#ff1493;"></i>
                <span><strong>QRIS</strong> (Gopay, OVO, Dana, ShopeePay)</span>
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="transfer" onclick="selectPayment('transfer')">
                <i class="fas fa-university" style="color:#ff1493;"></i>
                <span><strong>Transfer Bank</strong></span>
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="cod" onclick="selectPayment('cod')">
                <i class="fas fa-truck" style="color:#ff1493;"></i>
                <span><strong>COD</strong> (Bayar di Tempat)</span>
            </label>
        </div>

        <!-- Detail Metode Pembayaran -->
        <div class="payment-details" id="payment-details-box">
            <!-- Detail dimuat lewat JS -->
        </div>

        <div>
            <div class="total-price-box">
                <span>Total Bayar:</span>
                <span id="pay-total-price">Rp0</span>
            </div>
            <button onclick="processCheckout()">Selesaikan Checkout</button>
        </div>
    </div>
</div>

<footer>
© 2026 Pink Shop
</footer>

<!-- ELEMEN NOTIFIKASI TOAST -->
<div id="toast"></div>

<!-- JAVASCRIPT KERANJANG + MULTI-PAYMENT -->
<script>
// Data Produk Spesifik: Skincare & Kipas Genggam
const products = [
    { id: 0, name: "Skincare", price: 129000, img: "https://images.unsplash.com/photo-1608248597163-49a64e408821?w=500&q=80" },
    { id: 1, name: "Kipas Genggam", price: 45000, img: "https://images.unsplash.com/photo-1618941723628-e27419c88498?w=500&q=80" }
];

// Pasang gambar online jika file img/*.jpg lokal belum tersedia
const cardImages = document.querySelectorAll('.card img');
cardImages.forEach((img, i) => {
    img.onerror = () => { img.src = products[i].img; };
    img.src = products[i].img;
});

// State Keranjang
let cart = [];
let selectedPaymentMethod = 'qris';

// 1. Tambah Produk ke Keranjang
function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    const existingItem = cart.find(item => item.id === productId);

    if (existingItem) {
        existingItem.qty += 1;
    } else {
        cart.push({ ...product, qty: 1 });
    }

    updateCartUI();
    showToast(`🌸 ${product.name} dimasukkan ke keranjang!`);
}

// 2. Ubah Kuantitas (- / +)
function changeQty(productId, delta) {
    const item = cart.find(i => i.id === productId);
    if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
            cart = cart.filter(i => i.id !== productId);
        }
    }
    updateCartUI();
}

// 3. Hapus Produk
function removeItem(productId) {
    cart = cart.filter(i => i.id !== productId);
    updateCartUI();
}

// 4. Update Tampilan Keranjang
function updateCartUI() {
    const badge = document.getElementById('cart-badge');
    const container = document.getElementById('cart-items-container');
    const totalPriceEl = document.getElementById('cart-total-price');

    const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
    badge.innerText = totalItems;

    if (cart.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">Keranjang Anda masih kosong 🌸</p>`;
    } else {
        container.innerHTML = cart.map(item => `
            <div class="cart-item">
                <img src="${item.img}" alt="${item.name}">
                <div class="cart-item-info">
                    <div class="cart-item-title">${item.name}</div>
                    <div class="cart-item-price">Rp${(item.price * item.qty).toLocaleString('id-ID')}</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="qty-number">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
                <button class="delete-item-btn" onclick="removeItem(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `).join('');
    }

    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    totalPriceEl.innerText = `Rp${totalPrice.toLocaleString('id-ID')}`;
    document.getElementById('pay-total-price').innerText = `Rp${totalPrice.toLocaleString('id-ID')}`;
}

// 5. Buka & Tutup Modal Keranjang
function openCart() {
    document.getElementById('cart-modal').style.display = 'flex';
}
function closeCart() {
    document.getElementById('cart-modal').style.display = 'none';
}

// 6. Alur Pindah ke Modal Pembayaran
function goToPayment() {
    if (cart.length === 0) {
        alert("Keranjang Anda kosong! Silakan tambah produk terlebih dahulu.");
        return;
    }
    closeCart();
    selectPayment('qris'); // Default ke QRIS
    document.getElementById('payment-modal').style.display = 'flex';
}

function closePayment() {
    document.getElementById('payment-modal').style.display = 'none';
}

// 7. Render Opsi Metode Pembayaran (QRIS, Bank Transfer, COD)
function selectPayment(method) {
    selectedPaymentMethod = method;
    const box = document.getElementById('payment-details-box');

    if (method === 'qris') {
        box.innerHTML = `
            <div class="qris-box">
                <p>Scan Kode QRIS berikut untuk membayar:</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PinkShopPayment" alt="QRIS Code">
                <p>Mendukung BCA, Mandiri, BRI, GoPay, OVO, DANA, ShopeePay</p>
            </div>
        `;
    } else if (method === 'transfer') {
        box.innerHTML = `
            <p>Pilih Bank Tujuan Transfer:</p>
            <select class="bank-select" id="bank-choice">
                <option value="BCA">Bank BCA (8830123999 a.n Pink Shop)</option>
                <option value="Mandiri">Bank Mandiri (137000998811 a.n Pink Shop)</option>
                <option value="BRI">Bank BRI (0123010998877 a.n Pink Shop)</option>
                <option value="BNI">Bank BNI (0987654321 a.n Pink Shop)</option>
            </select>
            <p style="margin-top:8px; font-size:11px; color:#666;">*Silakan lakukan transfer sesuai total biaya ke rekening di atas.</p>
        `;
    } else if (method === 'cod') {
        box.innerHTML = `
            <p><strong>Bayar di Tempat (COD)</strong></p>
            <p style="margin-top:5px; color:#666;">Siapkan uang pas saat kurir mengantarkan paket pesanan Anda ke alamat rumah.</p>
        `;
    }
}

// 8. Selesaikan Checkout Pesanan
function processCheckout() {
    let detailText = "";
    if (selectedPaymentMethod === 'qris') {
        detailText = "Metode Pembayaran: QRIS";
    } else if (selectedPaymentMethod === 'transfer') {
        const bank = document.getElementById('bank-choice').value;
        detailText = `Metode Pembayaran: Transfer ${bank}`;
    } else {
        detailText = "Metode Pembayaran: COD (Bayar di Tempat)";
    }

    alert(`✨ Pesanan Berhasil dibuat!\n\n${detailText}\nTotal: ${document.getElementById('pay-total-price').innerText}\n\nTerima kasih sudah belanja di Pink Shop! 🌸`);
    
    // Reset Keranjang
    cart = [];
    updateCartUI();
    closePayment();
}

// 9. Toast Popup Notification
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.className = "show";
    setTimeout(() => { toast.className = ""; }, 2200);
}
</script>

</body>
</html>
