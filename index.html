<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Penjualan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    width:90%;
    margin:20px auto;
}

.produk{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:white;
    width:220px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    overflow:hidden;
    text-align:center;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card h3{
    margin:10px 0;
}

.card p{
    color:#4CAF50;
    font-weight:bold;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 20px;
    margin:15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#388E3C;
}
</style>
</head>

<body>

<header>
    <h1>Toko Online</h1>
    <p>Halaman Penjualan E-Commerce</p>
</header>

<div class="container">
    <div class="produk">

        <div class="card">
            <img src="https://via.placeholder.com/220x200" alt="Produk">
            <h3>Sepatu Sneakers</h3>
            <p>Rp250.000</p>
            <button>Beli</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/220x200" alt="Produk">
            <h3>Tas Wanita</h3>
            <p>Rp180.000</p>
            <button>Beli</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/220x200" alt="Produk">
            <h3>Jam Tangan</h3>
            <p>Rp320.000</p>
            <button>Beli</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/220x200" alt="Produk">
            <h3>Headset</h3>
            <p>Rp150.000</p>
            <button>Beli</button>
        </div>

    </div>
</div>

</body>
</html>
