<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Shop - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 3px solid #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="font-size: 50px; color: #ff1493; margin-bottom: 10px;">
            <i class="fas fa-heart"></i>
        </div>
        <h2 style="color: #ff1493; font-size: 26px;">Pink Shop Login</h2>
        <p style="font-size: 13px; color: #777; margin-bottom: 25px;">Masukkan akun Anda untuk melanjutkan 🌸</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="Ketik username..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Ketik password..." required>
            </div>
            <button type="submit" class="btn-pink" style="width: 100%; margin-top: 10px;">
                Masuk Sekarang 💖
            </button>
        </form>

        <div style="margin-top: 20px; font-size: 11px; color: #888; border-top: 1px dashed #ffd1dc; padding-top: 12px;">
            <p>💡 <strong>Gunakan Login Berikut:</strong></p>
            <p><strong>Admin:</strong> User: <code>admin</code> | Pass: <code>admin123</code></p>
            <p><strong>Customer:</strong> Ketik Username Bebas</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('pink_user_role', 'admin');
                alert("👑 Login Sukses sebagai Admin!");
                window.location.href = 'admin.html';
            } else {
                localStorage.setItem('pink_user_role', 'customer');
                localStorage.setItem('pink_username', user);
                alert(`🌸 Selamat Datang, ${user}!`);
                window.location.href = 'shop.html';
            }
        }
    </script>
</body>
</html>
