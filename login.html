<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pink Gemas ✨</title>
  <!-- Import Font Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      overflow: hidden;
      position: relative;
    }

    /* Animasi Bola Apung di Background */
    .bg-shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      animation: float 6s infinite ease-in-out;
    }

    .shape1 { width: 140px; height: 140px; top: 10%; left: 8%; animation-delay: 0s; }
    .shape2 { width: 180px; height: 180px; bottom: 12%; right: 10%; animation-delay: 2s; }
    .shape3 { width: 90px; height: 90px; bottom: 18%; left: 12%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-22px) rotate(10deg); }
    }

    /* Kartu Login */
    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 40px 35px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(255, 107, 139, 0.25);
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.7);
      position: relative;
      z-index: 10;
    }

    .avatar-icon {
      width: 80px;
      height: 80px;
      background: #ffe3ec;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin: 0 auto 15px auto;
      box-shadow: 0 5px 15px rgba(255, 107, 139, 0.2);
    }

    .login-card h2 {
      color: #ff477e;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card p {
      color: #887480;
      font-size: 13px;
      margin-bottom: 25px;
    }

    /* Form Input */
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ff5c8a;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 18px;
      border: 2px solid #ffd0dd;
      border-radius: 16px;
      outline: none;
      font-size: 14px;
      color: #555;
      background: #fff;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      border-color: #ff477e;
      box-shadow: 0 0 10px rgba(255, 71, 126, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      user-select: none;
    }

    /* Opsi Login & Checkbox */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 22px;
      color: #777;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .options input[type="checkbox"] {
      accent-color: #ff477e;
    }

    .forgot-link {
      color: #ff477e;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Tombol Utama */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 117, 140, 0.5);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .footer-text {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }

    .footer-text a {
      color: #ff477e;
      font-weight: 700;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Dekorasi Background -->
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>

  <!-- Kartu Login -->
  <div class="login-card">
    <div class="avatar-icon">🎀</div>
    <h2>Halo Manis! 💕</h2>
    <p>Silakan masuk ke akun kamu ya~</p>

    <form onsubmit="event.preventDefault(); alert('Yeay, kamu berhasil masuk! ✨');">
      <div class="input-group">
        <label for="username">Username / Email</label>
        <div class="input-wrapper">
          <input type="text" id="username" placeholder="Ketik nama atau email..." required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Ingat saya
        </label>
        <a href="#" class="forgot-link">Lupa password?</a>
      </div>

      <button type="submit" class="btn-login">Masuk ✨</button>
    </form>

    <p class="footer-text">
      Belum punya akun? <a href="#">Daftar dulu yuk</a>
    </p>
  </div>

  <!-- JavaScript Sederhana -->
  <script>
    function togglePassword() {
      const passInput = document.getElementById('password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }
  </script>
</body>
</html>
