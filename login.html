<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Shop - Login Only</title>
    
    <!-- Font & Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
            padding: 20px;
        }

        /* --- CARD LOGIN --- */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 3px solid #ffffff;
            animation: floatIn 0.5s ease-out;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-header {
            font-size: 50px;
            color: #ff1493;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #ff1493;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 25px;
        }

        /* --- FORM STYLING --- */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #ff1493;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #ff69b4;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 2px solid #ffd1dc;
            border-radius: 15px;
            outline: none;
            font-size: 14px;
            background: #fff8fa;
            color: #4a4a4a;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #ff1493;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
        }

        /* --- BUTTON --- */
        .btn-pink {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-pink:hover {
            background: #ff1493;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 20, 147, 0.5);
        }

        .btn-pink:active {
            transform: translateY(0);
        }

        /* --- NOTIFIKASI ALERT INSIDE CARD --- */
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-header">
            <i class="fas fa-heart"></i>
        </div>
        <h2>Pink Shop Login</h2>
        <p class="subtitle">Selamat datang! Silakan login ✨</p>
        
        <!-- Box Pesan Status Login -->
        <div id="alert-msg" class="alert-box"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username..." required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password..." required>
                </div>
            </div>

            <button type="submit" class="btn-pink">
                Masuk 💖
            </button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alert-msg');

            // Reset Notifikasi
            alertBox.style.display = 'none';
            alertBox.className = 'alert-box';

            if (usernameInput === "" || passwordInput === "") {
                showAlert("Form tidak boleh kosong!", "error");
                return;
            }

            // Simulasi Login Tanpa Redirect Ke Halaman Lain
            showAlert(`🌸 Login Berhasil! Selamat datang, ${usernameInput}.`, "success");
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-msg');
            alertBox.innerText = message;
            alertBox.classList.add(type === 'success' ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
